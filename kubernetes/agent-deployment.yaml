apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-agent-system
  labels:
    app: multi-agent-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multi-agent-system
  template:
    metadata:
      labels:
        app: multi-agent-system
    spec:
      containers:
      - name: multi-agent-system
        image: multi-agent-system:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 7860
        resources:
          requests:
            memory: "4Gi"
            cpu: "1"
          limits:
            memory: "8Gi"
            cpu: "2"
        env:
        - name: MODEL_PATH
          value: "/app/models/mistral-7b-instruct-v0.2.Q4_K_M.gguf"
        - name: NUM_AGENTS
          value: "3"
        - name: MAX_ITERATIONS
          value: "10"
        - name: CONVERGENCE_THRESHOLD
          value: "0.98" 
        - name: TEMPERATURE_STRATEGY
          value: "decreasing"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: huggingface-credentials
              key: token
              optional: true
        - name: HF_USERNAME
          valueFrom:
            secretKeyRef:
              name: huggingface-credentials
              key: username
              optional: true
        volumeMounts:
        - name: models-volume
          mountPath: /app/models
        - name: chroma-volume
          mountPath: /app/chroma_db
      volumes:
      - name: models-volume
        persistentVolumeClaim:
          claimName: models-pvc
      - name: chroma-volume
        persistentVolumeClaim:
          claimName: chroma-pvc 