apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-worker
  labels:
    app: agent-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-worker
  template:
    metadata:
      labels:
        app: agent-worker
    spec:
      containers:
      - name: agent-worker
        image: multi-agent-system:latest
        imagePullPolicy: IfNotPresent
        command: ["python", "worker.py"]
        resources:
          requests:
            memory: "4Gi"
            cpu: "1"
          limits:
            memory: "8Gi"
            cpu: "2"
        env:
        - name: MODEL_PATH
          value: "/app/models/mistral-7b-instruct-v0.2.Q4_K_M.gguf"
        - name: WORKER_MODE
          value: "true"
        - name: REDIS_HOST
          value: "redis-service"
        - name: USE_MISTRAL_NATIVE
          value: "false"
        - name: MODEL_TYPE
          value: "mistral"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: huggingface-credentials
              key: token
              optional: true
        - name: HF_USERNAME
          valueFrom:
            secretKeyRef:
              name: huggingface-credentials
              key: username
              optional: true
        - name: USE_HF_AUTH
          value: "true"
        volumeMounts:
        - name: models-volume
          mountPath: /app/models
        - name: chroma-volume
          mountPath: /app/chroma_db
      volumes:
      - name: models-volume
        persistentVolumeClaim:
          claimName: models-pvc
      - name: chroma-volume
        persistentVolumeClaim:
          claimName: chroma-pvc
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-worker-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agent-worker
  minReplicas: 1
  maxReplicas: 1000000
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70 